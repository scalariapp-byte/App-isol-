name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Le SDK Android est préinstallé sur ubuntu-latest (ANDROID_HOME).
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Isolateur.apk
      - uses: actions/upload-artifact@v4
        with:
          name: isolateur-debug-apk
          path: Isolateur.apk
      - name: Publier l'APK (release "latest")
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Isolateur (dernière version)
          prerelease: true
          files: Isolateur.apk
